<style>
  :root{
    --bg:#ffffff; --panel:#f7f8fa; --ink:#1a1a1a; --muted:#6b7280;
    --line:#e5e7eb; --nodata:#d9dce1; --accent:#166534;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:840px; margin:0 auto; padding:28px 20px 48px}
  header h1{font-size:24px; margin:0 0 4px; letter-spacing:.5px}
  header p.sub{margin:0; color:var(--muted); font-size:14px}
  .chart{position:relative; margin-top:18px}
  svg{display:block; width:100%; height:auto; background:var(--panel);
      border:1px solid var(--line); border-radius:12px}
  .county{stroke:#fff; stroke-width:.7; transition:opacity .15s}
  .county:hover{stroke:#111; stroke-width:1.4}
  .label{font-size:11px; fill:#111; paint-order:stroke; stroke:#fff; stroke-width:2.6px;
         stroke-linejoin:round; pointer-events:none; text-anchor:middle; font-weight:600}
  .label .v{font-size:9px; fill:#374151; font-weight:400}
  .legend text{font-size:11px; fill:var(--ink)}
  .legend .caption{font-size:12px; font-weight:600}
  .tip{position:absolute; pointer-events:none; background:#111; color:#fff;
       font-size:12px; padding:7px 9px; border-radius:7px; opacity:0;
       transform:translate(-50%,-120%); white-space:nowrap; line-height:1.4;
       box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .tip b{font-size:13px}
  footer{margin-top:16px; color:var(--muted); font-size:12px; line-height:1.7}
  .note{margin-top:6px}
</style>

const projection = d3.geoMercator().fitExtent([[20, 20], [W - 20, H - 110]], geo);
const path = d3.geoPath(projection);

// ===== 3. 色階：單一色相（綠）分級 threshold =====
const breaks = [5000, 30000, 60000, 120000, 200000];
const colors = ["#e8f2e2", "#bfe0ad", "#8ecb74", "#4f9e50", "#2f7d36", "#14532d"];
const color = d3.scaleThreshold().domain(breaks).range(colors);
const fillOf = d => d == null ? "#d9dce1" : color(d);
const fmt = d3.format(",");

// ===== 4. 畫縣市 =====
svg.append("g").selectAll("path")
  .data(geo.features)
  .join("path")
    .attr("class", "county")
    .attr("d", path)
    .attr("fill", d => fillOf(d.properties.rice))
  .on("mousemove", (event, d) => {
      const p = d.properties;
      const v = p.rice == null ? "無生產統計"
              : fmt(p.rice) + " 公噸" + (p.approx ? "（2018＊）" : "");
      tip.style("opacity", 1)
         .style("left", event.offsetX + "px")
         .style("top",  event.offsetY + "px")
         .html("<b>" + p.name + "</b><br>稻米產量：" + v);
  })
  .on("mouseleave", () => tip.style("opacity", 0));

// ===== 5. 主要產區標註（前 8 名）=====
const topN = geo.features
  .filter(d => d.properties.rice != null)
  .sort((a, b) => b.properties.rice - a.properties.rice)
  .slice(0, 8);

svg.append("g").selectAll("text")
  .data(topN)
  .join("text")
    .attr("class", "label")
    .attr("transform", d => "translate(" + path.centroid(d) + ")")
    .call(t => t.append("tspan").attr("x", 0).attr("dy", "-0.1em").text(d => d.properties.name))
    .call(t => t.append("tspan").attr("class", "v").attr("x", 0).attr("dy", "1.1em")
                .text(d => fmt(d.properties.rice)));

// ===== 6. 圖例 =====
const lg = svg.append("g").attr("class", "legend").attr("transform", "translate(30," + (H - 60) + ")");
lg.append("text").attr("class", "caption").attr("y", -10).text("稻米產量（公噸）");
const bw = 44;
lg.selectAll("g.cell").data(colors).join("g").attr("class", "cell")
  .attr("transform", (d, i) => "translate(" + (i * bw) + ",0)")
  .call(g => g.append("rect").attr("width", bw).attr("height", 12).attr("fill", d => d))
  .call(g => g.append("text").attr("x", 0).attr("y", 26).text((d, i) => {
      if (i === 0) return "< " + fmt(breaks[0]);
      if (i === colors.length - 1) return "≥ " + fmt(breaks[breaks.length - 1]);
      return fmt(breaks[i - 1]);
  }));
const nd = lg.append("g").attr("transform", "translate(" + (colors.length * bw + 20) + ",0)");
nd.append("rect").attr("width", 14).attr("height", 12).attr("fill", "#d9dce1");
nd.append("text").attr("x", 18).attr("y", 11).text("無資料");
</script>
</body>
</html>
